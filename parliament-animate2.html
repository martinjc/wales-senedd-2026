<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="//d3js.org/d3.v6.min.js"></script>
    <script src="//unpkg.com/d3-hexjson"></script>
    <script src="//unpkg.com/topojson@3"></script>
    <script src="lib/d3-parliament-chart.js"></script>

    <title>Wales Senedd Constituency and Electoral Region Hexmap</title>
    <style>
        html,
        body {
            margin: 0px;
            padding: 0px;

            height: 100%;
            width: 100%;

            background-color: #ddd;

            position: relative;

            font-family: "Open Sans", sans-serif;
            color: #555;
        }

        #map {
            display: block;
            width: 80%;
            margin: auto;
            padding-top: 80px;
        }

        #map text {
            font-size: 8px;
            pointer-events: none;
        }

        #info {
            clear: both;
            visibility: hidden;
            padding: 30px;
        }

        #info.active {
            visibility: visible;
        }
    </style>
</head>

<body>
    <div id='map'></div>
    <div id="info">
        <h1>This is <span id="sc_name"></span></h1>
    </div>

    <script>

        let width = d3.select('#map').node().clientWidth;

        let height = 800;

        let margin = {
            top: 30,
            bottom: 30,
            left: 30,
            right: 30
        }

        let party_details = {
            'Labour': { name: 'Labour', colour: '#DC241f' },
            'Plaid Cymru': { name: 'Plaid Cymru', colour: '#008142' },
            'Green': { name: 'Green Party', colour: '#6AB023' },
            'Liberal Democrats': { name: 'Liberal Democrats', colour: '#FDBB30' },
            'Independent': { name: 'Independent', colour: '#aaa' },
            'Conservative': { name: 'Conservative', colour: '#0087DC' },
            'Reform UK': { name: 'Reform UK', colour: '#12B6CF' },
            'No Result': { name: 'No Result', colour: '#eee' }
        }

        let parties = Object.keys(party_details);

        let svg = d3.select('#map').append('svg').attr("width", width).attr('height', height);

        let hexes = true;

        Promise.all([
            d3.csv('data/senedd_multiple_hexes.csv'),
            d3.json('data/senedd_2026_multiple.hexjson'),
        ]).then(([sc_data, sc_hexes_multiple]) => {


            function pointy_hex_corner(center, size, i) {
                let angle_deg = 60 * i;
                let angle_rad = Math.PI / 180 * angle_deg;
                return [center[0] + size * Math.cos(angle_rad), center[1] + size * Math.sin(angle_rad)];
            }

            sc_data.sort((a, b) => {
                return parties.indexOf(a.Party) - parties.indexOf(b.Party);
            });

            sc_hexes_rendered = d3.renderHexJSON(sc_hexes_multiple, width - margin.left - margin.right, height - margin.top - margin.bottom);
            console.log(sc_hexes_rendered);
            pc = d3.parliamentChart(sc_data, width)
                .sections(1)
                .sectionGap(0)
                .seatRadius(20)
                .rowHeight(60);

            triangles_data = pc.data();
            triangles_data.forEach((d, i) => {
                d.parent_hex = sc_hexes_rendered.find(h => h.key === d.seat_id);
            });

            console.log(triangles_data);

            function getColour(hex, index) {
                let sc_info = sc_data.find(d => d.id === `${hex.No_Rhif}_${index}`);
                if (sc_info) {
                    let party = party_details[sc_info.Party];
                    if (party) {
                        return party.colour;
                    } else {
                        return 'purple';
                    }
                } else {
                    return 'purple';
                }
            }

            function advance() {

                if (hexes) {
                    svg.selectAll('polygon')
                        .transition()
                        .delay(100)
                        .duration(2000)
                        .attr('transform', d => `translate(${d.x}, ${d.y})`)
                        .attr('points', d => [
                            ...Array.from({ length: 6 }, (_, i) => pointy_hex_corner([0, 0], pc.seatRadius(), i)),
                        ])
                        .attr('fill', d => party_details[d.Party].colour)
                        .attr('stroke', '#fff')
                        .attr('stroke-width', 2);

                    svg.selectAll('.boundary')
                        .transition()
                        .delay(100)
                        .duration(2000)
                        .attr('stroke-width', 0);
                    hexes = false;
                } else {
                    svg.selectAll('polygon')
                        .transition()
                        .delay(100)
                        .duration(2000)
                        .attr('transform', (t) => `translate(${t.parent_hex.x + margin.left},${t.parent_hex.y + margin.top})`)
                        .attr('points', (t) => t.parent_hex.points)
                        .attr('fill', (t) => getColour(t, t.Segment))
                        .attr('stroke', '#eee')
                        .attr('stroke-width', 0.5);

                    svg.selectAll('.boundary')
                        .transition()
                        .delay(100)
                        .duration(2000)
                        .attr('stroke-width', 4);
                    hexes = true;
                }
            }
            let scer_hexmap = svg.selectAll('g')
                .data(triangles_data)
                .join((enter) => {
                    enter.append('polygon')
                        .attr('transform', (hex) => `translate(${hex.parent_hex.x + margin.left},${hex.parent_hex.y + margin.top})`)
                        .attr('points', (hex) => hex.parent_hex.points)
                        .attr('stroke', '#eee')
                        .attr('fill', (hex) => getColour(hex, hex.Segment))
                        .attr('stroke-width', 1)
                        .attr('id', (hex) => hex.key)
                        .attr('data-name', (hex) => hex.name)
                });

            sc_boundaries = d3.getBoundarySegmentsForHexJSON(sc_hexes_multiple, width - margin.left - margin.right, height - margin.top - margin.bottom, "English_Na");
            let boundaries = svg.selectAll('line')
                .data(sc_boundaries)
                .join((enter) => {
                    enter.append('line')
                        .attr('class', 'boundary')
                        .attr('x1', (boundary) => boundary.x1 + margin.left)
                        .attr('y1', (boundary) => boundary.y1 + margin.top)
                        .attr('x2', (boundary) => boundary.x2 + margin.left)
                        .attr('y2', (boundary) => boundary.y2 + margin.top)
                        .attr('fill', 'none')
                        .attr('stroke', '#fff')
                        .attr('stroke-width', 4)
                });

            const interval = setInterval(advance, 5000);
        });
    </script>

</body>

</html>
