<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="//d3js.org/d3.v6.min.js"></script>
    <script src="//unpkg.com/d3-hexjson"></script>
    <title>Wales Senedd Constituency and Electoral Region Hexmap</title>
    <style>
        html,
        body {
            margin: 0px;
            padding: 0px;

            height: 100%;
            width: 100%;

            background-color: #ddd;

            position: relative;

            font-family: "Open Sans", sans-serif;
            color: #555;
        }

        #sc_map,
        #sc_bg_map {
            display: block;
            width: 45%;
            float: left;
        }

        #info {
            clear: both;
            visibility: hidden;
            padding: 30px;
        }

        #info.active {
            visibility: visible;
        }
    </style>
</head>

<body>
    <div id='sc_map'></div>
    <div id="sc_bg_map"></div>
    <div id="info">
        <h1>This is <span id="sc_name"></span></h1>
    </div>

    <script>


        let party_details = {
            'Labour': { name: 'Labour', colour: '#DC241f' },
            'Conservative': { name: 'Conservative', colour: '#0087DC' },
            'Green': { name: 'Green Party', colour: '#6AB023' },
            'Liberal Democrats': { name: 'Liberal Democrats', colour: '#FDBB30' },
            'Plaid Cymru': { name: 'Plaid Cymru', colour: '#008142' },
            'Independent': { name: 'Independent', colour: '#888' },
            'Reform UK': { name: 'Reform UK', colour: '#12B6CF' },
            'No Result': { name: 'No Result', colour: '#fff' }
        }

        let width = d3.select('#sc_map').node().clientWidth;

        let height = 600;

        let margin = {
            top: 30,
            bottom: 30,
            left: 30,
            right: 30
        }

        let sc_svg = d3.select('#sc_map').append('svg').attr("width", width).attr('height', height);
        let sc_bg_svg = d3.select('#sc_bg_map').append('svg').attr("width", width).attr('height', height);

        let projection = d3.geoMercator();
        let path = d3.geoPath().projection(projection);

        let activeGroup = null;

        function reset() {
            d3.selectAll('.map-element')
                .attr('opacity', '1.0');
            activeGroup = null;

            d3.select('#info')
                .classed('active', false);
        }

        function mouseover(event, d) {
            // Apply hover effect to all elements in the same group, unless they are the active group
            let groupName = d.English_Na;
            if (activeGroup !== groupName) {
                d3.selectAll(`.map-element[data-group="${groupName}"]`)
                    .attr('opacity', '0.5'); // Grey transparency overlay simulation

                d3.select("#info").classed("active", true);
                if (d.English_Na) {
                    d3.select('#sc_name').text(d.English_Na);
                }
            }
        }

        function mouseout(event, d) {
            let groupName = d.English_Na;
            if (activeGroup !== groupName) {
                d3.selectAll(`.map-element[data-group="${groupName}"]`)
                    .attr('opacity', '1.0');

                if (!activeGroup) {
                    d3.select('#info').classed('active', false);
                } else {
                    // Restore info for active group
                    d3.select('#sc_name').text(activeGroup);
                }
            }
        }

        function clicked(event, d) {
            let groupName = d.English_Na;
            console.log("Clicked group:", groupName);

            if (activeGroup === groupName) {
                reset();
            } else {
                // Reset everything first
                d3.selectAll('.map-element').attr('opacity', '1.0');

                // Set new active group
                activeGroup = groupName;

                // Highlight new group
                d3.selectAll(`.map-element[data-group="${groupName}"]`)
                    .attr('opacity', '0.2');

                d3.select("#info").classed("active", true);
                if (d.English_Na) {
                    d3.select('#sc_name').text(d.English_Na);
                }
            }
        }

        Promise.all([
            d3.json('data/senedd_2026_multiple_nc.hexjson'),
            d3.json('data/senedd_2026_multiple_nc_with_background.hexjson'),
            d3.csv('data/senedd_multiple_hexes.csv')
        ]).then(([sc_hexes_multiple, sc_hexes_multiple_with_bg, sc_data]) => {

            function getColour(hex, index) {
                if (hex.English_Na) {
                    let sc_info = sc_data.find(d => d.id === `${hex.No_Rhif}_${index}`);
                    if (sc_info) {
                        let party = party_details[sc_info.Party];
                        if (party) {
                            return party.colour;
                        } else {
                            return '#ccc';
                        }
                    } else {
                        return '#ccc';
                    }
                } else {
                    return '#ccc';
                }
            }


            sc_hexes_multiple_rendered = d3.renderHexJSON(sc_hexes_multiple, width - margin.left - margin.right, height - margin.top - margin.bottom);
            let sc_hexmap = sc_svg.selectAll('g')
                .data(sc_hexes_multiple_rendered)
                .join((enter) => {
                    enter.append('g')
                        .attr('transform', (hex) => `translate(${hex.x + margin.left},${hex.y + margin.top})`)
                        .append('polygon')
                        .attr('points', (hex) => hex.points)
                        .attr('stroke', '#eee')
                        .attr('fill', (hex) => getColour(hex, hex.Segment))
                        .attr('stroke-width', 1)
                        .attr('id', (hex) => hex.key)
                        .attr('data-name', (hex) => hex.name)
                        .attr('data-group', (hex) => hex.English_Na)
                        .classed('map-element', true)
                        .on('click', clicked)
                        .on('mouseover', mouseover)
                        .on('mouseout', mouseout);
                });

            sc_boundaries = d3.getBoundarySegmentsForHexJSON(sc_hexes_multiple, width - margin.left - margin.right, height - margin.top - margin.bottom, "English_Na");
            let boundaries = sc_svg.selectAll('line')
                .data(sc_boundaries)
                .join((enter) => {
                    enter.append('line')
                        .attr('x1', (boundary) => boundary.x1 + margin.left)
                        .attr('y1', (boundary) => boundary.y1 + margin.top)
                        .attr('x2', (boundary) => boundary.x2 + margin.left)
                        .attr('y2', (boundary) => boundary.y2 + margin.top)
                        .attr('fill', 'none')
                        .attr('stroke', '#444')
                        .attr('stroke-width', 3)
                });

            sc_hexes_bg_multiple_rendered = d3.renderHexJSON(sc_hexes_multiple_with_bg, width - margin.left - margin.right, height - margin.top - margin.bottom);
            let sc_bg_hexmap = sc_bg_svg.selectAll('g')
                .data(sc_hexes_bg_multiple_rendered)
                .join((enter) => {
                    enter.append('g')
                        .attr('transform', (hex) => `translate(${hex.x + margin.left},${hex.y + margin.top})`)
                        .append('polygon')
                        .attr('points', (hex) => hex.points)
                        .attr('stroke', '#eee')
                        .attr('fill', (hex) => getColour(hex, hex.Segment))
                        .attr('stroke-width', 1)
                        .attr('id', (hex) => hex.key)
                        .attr('data-name', (hex) => hex.name)
                        .attr('data-group', (hex) => hex.English_Na)
                        .classed('map-element', true)
                        .on('click', clicked)
                        .on('mouseover', mouseover)
                        .on('mouseout', mouseout);
                });

            console.log(sc_hexes_multiple_with_bg);


            let sc_bg_boundaries = d3.getBoundarySegmentsForHexJSON(sc_hexes_multiple_with_bg, width - margin.left - margin.right, height - margin.top - margin.bottom, "English_Na");
            let bg_boundaries = sc_bg_svg.selectAll('line')
                .data(sc_bg_boundaries)
                .join((enter) => {
                    enter.append('line')
                        .attr('x1', (boundary) => boundary.x1 + margin.left)
                        .attr('y1', (boundary) => boundary.y1 + margin.top)
                        .attr('x2', (boundary) => boundary.x2 + margin.left)
                        .attr('y2', (boundary) => boundary.y2 + margin.top)
                        .attr('fill', 'none')
                        .attr('stroke', '#444')
                        .attr('stroke-width', 3)
                });
        });

    </script>

</body>

</html>
