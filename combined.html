<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="//d3js.org/d3.v6.min.js"></script>
    <script src="//unpkg.com/d3-hexjson"></script>
    <script src="//unpkg.com/topojson@3"></script>
    <script src="lib/d3-parliament-chart.js"></script>
    <title>Wales Senedd 2026 - Combined View</title>
    <style>
        html,
        body {
            margin: 0px;
            padding: 0px;
            height: 100%;
            width: 100%;
            background-color: #ddd;
            position: relative;
            font-family: "Open Sans", sans-serif;
            color: #555;
        }

        #diagrams-container {
            display: flex;
            flex-direction: column;
            /* Mobile first */
            width: 100%;
            height: 100%;
            /* Or auto? */
            padding: 10px;
            box-sizing: border-box;
        }

        .map-container {
            flex: 1;
            min-width: 0;
            min-height: 400px;
            /* Minimum height for visibility */
            margin: 5px;
            position: relative;
            /* For SVG positioning if needed */
        }

        /* Desktop */
        @media (min-width: 768px) {
            #diagrams-container {
                flex-direction: row;
            }
        }

        #info {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            text-align: center;
            border-top: 1px solid #ccc;
            z-index: 100;
        }

        #info h1 {
            margin: 0;
            font-size: 1.2em;
        }
    </style>
</head>

<body>

    <div id="diagrams-container">
        <div id="sc_map" class="map-container"></div>
        <div id="scm_map" class="map-container"></div>
        <div id="parliament_map" class="map-container"></div>
    </div>

    <div id="info">
        <h1>Details: <span id="sc_name">Hover/Click a region</span></h1>
    </div>

    <script>
        let party_details = {
            'Labour': { name: 'Labour', colour: '#DC241f' },
            'Conservative': { name: 'Conservative', colour: '#0087DC' },
            'Green': { name: 'Green Party', colour: '#6AB023' },
            'Liberal Democrats': { name: 'Liberal Democrats', colour: '#FDBB30' },
            'Plaid Cymru': { name: 'Plaid Cymru', colour: '#008142' },
            'Independent': { name: 'Independent', colour: '#aaa' },
            'Reform UK': { name: 'Reform UK', colour: '#12B6CF' },
            'No Result': { name: 'No Result', colour: '#eee' }
        };

        // Function to handle interactions
        // We will now select by constituency class/attribute

        function reset() {
            d3.selectAll('.seat-element')
                .attr('opacity', '1.0')
                .attr('stroke', '#eee')
                .attr('stroke-width', 0.5); // Reset styles

            d3.selectAll('.boundary-line')
                .attr('opacity', '1.0');

            d3.select('#sc_name').html('Hover/Click a region');
        }

        function clicked(event, d) {
            event.stopPropagation();

            // Get constituency identifier
            // For hexjson d, it might be in properties if we merged data?
            // OR we passed it during render.
            // In our render loops below, we will attach data-constituency

            // However, d3 event listener passes 'd' which is the datum bound to the element.
            // For D1 wedges, D2 hexes, D3 dots, we need to ensure 'd' has the info we need.

            let constituencyName = d.English_Na;
            let party = d.Party;
            let candidate = d.MS;

            // If we clicked a background hex in D1, data might be different (pure hexjson)
            // We need to look it up if missing.
            if (!constituencyName && d.n) { // hexjson often has 'n' for name or we looked up 'English_Na' in render?
                // Actually in renderHexJSON result, properties are copied.
                // But wait, the wedges have the specific seat data merged? No, currently getColour just returns colour.
                // We need to attach the full seat data to the DOM element datum or look it up.
                // Let's rely on the DOM element's data attribute if 'd' is insufficient, or better, bind the FULL info to the element.
                reset();
                d3.select('#sc_name').text('No data for this element');
                return;
            }

            reset(); // Clear previous selection

            // Highlight all elements with this constituency
            // We will add a class 'c-{cleaned_name}' to make selection easy, or filtering.

            // 1. Fade everything out
            d3.selectAll('.seat-element').attr('opacity', '0.1');
            d3.selectAll('.boundary-line').attr('opacity', '0.1');

            // 2. Initialise info string
            let infoParams = `<strong>${constituencyName}</strong>`;
            if (candidate && party) {
                infoParams += `<br/>Winner: ${candidate} (${party})`;
            } else {
                infoParams += `<br/>(General Constituency View)`;
            }
            d3.select('#sc_name').html(infoParams);

            // 3. Highlight specific group
            d3.selectAll(`.constituency-${cleanString(constituencyName)}`)
                .attr('opacity', '1.0');

            // If a specific seat was clicked (has candidate info), maybe highlight it extra?
            // For now, highlighting the whole constituency is the requirement.
        }

        // Helper to make safe class names
        function cleanString(s) {
            return s ? s.replace(/[^a-zA-Z0-9]/g, '_') : 'unknown';
        }

        // Clear selection on background click
        d3.select('body').on('click', reset);

        // Map setup
        window.addEventListener('load', () => {

            const height = 600;
            // margins
            const margin = { top: 30, bottom: 30, left: 30, right: 30 };

            Promise.all([
                d3.json('data/senedd_2026.hexjson'),
                d3.json('data/senedd_2026_multiple.hexjson'),
                d3.csv('data/senedd_multiple_hexes.csv')
            ]).then(([sc_hexes, sc_hexes_multiple, sc_data]) => {



                // Helper to get full seat info
                function getSeatInfo(hex, index) {
                    // hex is the hexjson object, index is segment 1-6
                    let sc_info = sc_data.find(d => d.id === `${hex.No_Rhif}_${index}`);
                    return sc_info; // Returns the CSV row object or undefined
                }

                // --- 1. Single Constituency Map ---
                try {
                    const container = d3.select('#sc_map');
                    const width = container.node().clientWidth || 500;

                    const svg = container.append('svg').attr("width", "100%").attr('height', height).attr('viewBox', `0 0 ${width} ${height}`);

                    const rendered = d3.renderHexJSON(sc_hexes, width - margin.left - margin.right, height - margin.top - margin.bottom);


                    svg.append('g')
                        .selectAll('g')
                        .data(rendered)
                        .join('g')
                        .attr('transform', (hex) => `translate(${hex.x + margin.left},${hex.y + margin.top})`)
                        .each(function (hex) {
                            // Context: 'this' is the group
                            const group = d3.select(this);

                            // 1. Resolve constituency name
                            let constituencyName = hex.n || "Unknown";
                            // Try to find it from data if possible
                            let info = getSeatInfo(hex, 1);
                            if (info && info.English_Na) constituencyName = info.English_Na;
                            hex.English_Na = constituencyName;

                            // 2. Append Background
                            group.append('polygon')
                                .attr('points', hex.points)
                                .attr('stroke', '#fff')
                                .attr('fill', '#ccc')
                                .attr('stroke-width', 3)
                                .attr('class', `seat-element constituency-${cleanString(constituencyName)}`)
                                .on('click', clicked);

                            // 3. Append Wedges
                            for (let i = 1; i <= 6; i++) {
                                let seatInfo = getSeatInfo(hex, i);
                                let color = seatInfo && party_details[seatInfo.Party] ? party_details[seatInfo.Party].colour : '#eee';

                                group.append('polygon')
                                    .attr('points', `0,0 ${hex.vertices[i - 1].x},${hex.vertices[i - 1].y} ${hex.vertices[i < 6 ? i : 0].x},${hex.vertices[i < 6 ? i : 0].y}`)
                                    .attr('fill', color)
                                    .attr('stroke', '#eee')
                                    .attr('stroke-width', 0.5)
                                    .attr('class', `seat-element constituency-${cleanString(constituencyName)}`)
                                    .on('click', function (event) {
                                        // Pass the specific seat info to clicked
                                        clicked(event, seatInfo || hex);
                                    });
                            }
                        });
                } catch (e) {
                    console.error("Error SC Map", e);

                }

                // --- 2. Multiple Hexes Map ---
                try {
                    const container = d3.select('#scm_map');
                    const width = container.node().clientWidth || 500;
                    const svg = container.append('svg').attr("width", "100%").attr('height', height).attr('viewBox', `0 0 ${width} ${height}`);

                    const rendered = d3.renderHexJSON(sc_hexes_multiple, width - margin.left - margin.right, height - margin.top - margin.bottom);

                    svg.append('g')
                        .selectAll('g')
                        .data(rendered)
                        .join('g')
                        .attr('transform', (hex) => `translate(${hex.x + margin.left},${hex.y + margin.top})`)
                        .append('polygon')
                        .attr('points', (hex) => hex.points)
                        .attr('stroke', '#eee')
                        .attr('fill', (hex) => {
                            let info = getSeatInfo(hex, hex.Segment);
                            return info && party_details[info.Party] ? party_details[info.Party].colour : 'purple';
                        })
                        .attr('stroke-width', 1)
                        .attr('class', (hex) => {
                            let info = getSeatInfo(hex, hex.Segment);
                            let constituencyName = info ? info.English_Na : (hex.n || "Unknown");
                            return `seat-element constituency-${cleanString(constituencyName)}`;
                        })
                        .each(function (hex) {
                            d3.select(this).datum(getSeatInfo(hex, hex.Segment) || hex);
                        })
                        .on('click', clicked);

                    // Boundaries
                    const boundaries = d3.getBoundarySegmentsForHexJSON(sc_hexes_multiple, width - margin.left - margin.right, height - margin.top - margin.bottom, "English_Na");

                    svg.append('g').selectAll('line')
                        .data(boundaries)
                        .join('line')
                        .attr('x1', (b) => b.x1 + margin.left)
                        .attr('y1', (b) => b.y1 + margin.top)
                        .attr('x2', (b) => b.x2 + margin.left)
                        .attr('y2', (b) => b.y2 + margin.top)
                        .attr('fill', 'none')
                        .attr('stroke', '#fff')
                        .attr('stroke-width', 3)
                        .attr('class', 'boundary-line'); // Add class for fading logic
                } catch (e) {
                    console.error("Error SCM Map", e);

                }

                // --- 3. Parliament Chart ---
                try {
                    const container = d3.select('#parliament_map');
                    const width = container.node().clientWidth || 500;
                    const svg = container.append('svg').attr("width", "100%").attr('height', height).attr('viewBox', `0 0 ${width} ${height}`);

                    let parties = Object.keys(party_details);

                    // Sort data
                    let sorted_data = [...sc_data].sort((a, b) => {
                        return parties.indexOf(a.Party) - parties.indexOf(b.Party);
                    });

                    // Parliament chart config
                    let pc = d3.parliamentChart(sorted_data, width);
                    pc.sections(1);
                    pc.sectionGap(0);
                    pc.seatRadius(10);
                    pc.rowHeight(30);

                    const dataWithCoords = pc.data();

                    svg.selectAll('g')
                        .data(dataWithCoords)
                        .enter()
                        .append('g')
                        .attr('transform', d => `translate(${d.x}, ${d.y + 50})`)
                        .append('polygon')
                        .attr('points', d => [
                            [-8, -8],
                            [8, -8],
                            [0, 8]
                        ])
                        .attr('fill', d => party_details[d.Party] ? party_details[d.Party].colour : '#ccc')
                        .attr('stroke', '#fff')
                        .attr('stroke-width', 1)
                        .attr('class', d => `seat-element constituency-${cleanString(d.English_Na)}`)
                        .on('click', clicked);
                } catch (e) {
                    console.error("Error Parliament", e);

                }

            }).catch(e => {
                console.error("Load Error", e);

            });
        });

        // Resize handler (naive reload or resize logic)
        // For simplicity in this task, we won't implement complex resize logic that redraws D3,
        // but typically one would debounce and re-run drawing functions.
        window.addEventListener('resize', () => {
            // location.reload(); // Simple way to handle resize for now
        });
    </script>
</body>

</html>
